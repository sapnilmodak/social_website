
services:
  social_backend_app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - social_backend_db
    networks:
      - canada_social_network

  social_backend_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: canada_social_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - canada_social_network

networks:
  canada_social_network:
    driver: bridge

volumes:
  postgres_data:
