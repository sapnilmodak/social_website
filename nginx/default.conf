# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name jagdeep4caledon.com admin.jagdeep4caledon.com api.jagdeep4caledon.com;
    return 301 https://$host$request_uri;
}

# Main Frontend (HTTPS)
server {
    listen 443 ssl;
    server_name jagdeep4caledon.com;

    ssl_certificate /etc/letsencrypt/live/jagdeep4caledon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jagdeep4caledon.com/privkey.pem;

    location / {
        proxy_pass http://social_frontend_app:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin Frontend (HTTPS)
server {
    listen 443 ssl;
    server_name admin.jagdeep4caledon.com;

    ssl_certificate /etc/letsencrypt/live/jagdeep4caledon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jagdeep4caledon.com/privkey.pem;

    location / {
        proxy_pass http://social_admin_frontend_app:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API (HTTPS)
server {
    listen 443 ssl;
    server_name api.jagdeep4caledon.com;

    ssl_certificate /etc/letsencrypt/live/jagdeep4caledon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jagdeep4caledon.com/privkey.pem;

    location / {
        proxy_pass http://social_backend_app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
